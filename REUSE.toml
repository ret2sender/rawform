#
# REUSE (https://reuse.software, specification 3.3) annotations for the files
# that carry no license header of their own: the vector and raster assets,
# the fonts and their license texts, the documents, and the dotfiles. Every
# source and build file carries its own header (scripts/add-license-headers.sh
# keeps it that way), so nothing here overrides a file's own statement
# (precedence stays at the default, "closest"). THIRD-PARTY-NOTICES.md is the
# prose record of the same provenance; the two must agree.
#
# `reuse lint` also needs the LICENSES/ directory populated with one text per
# identifier used below; `reuse download --all` fetches the SPDX ones. The
# LicenseRef text for the Segoe glyphs is committed, since no registry has it.

version = 1
SPDX-PackageName = "rawform"
SPDX-PackageSupplier = "Etienne Fleurant"
SPDX-PackageDownloadLocation = "https://github.com/ret2sender/rawform"

# Caption glyphs transcribed from the Breeze window decoration
# (kdecoration/breezebutton.cpp); each file's header records the derivation.
[[annotations]]
path = "ui/Sources/icons/breeze/**"
SPDX-FileCopyrightText = [
    "2014 Martin Graesslin",
    "2014 Hugo Pereira Da Costa",
    "The KDE Breeze contributors",
]
SPDX-License-Identifier = "GPL-2.0-or-later"

# The menu arrow comes from Breeze icons (geometry sanitized, colors adapted).
[[annotations]]
path = "ui/Sources/icons/app/dialogs/menu_arrow.svg"
SPDX-FileCopyrightText = "The Breeze icons authors, KDE community"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Window-control glyphs re-expressed from Microsoft's Segoe Fluent Icons so
# the title bar matches native Windows chrome. The font is not bundled and is
# not open source; the LicenseRef text in LICENSES/ records the provenance
# and points at Microsoft's terms.
[[annotations]]
path = "ui/Sources/icons/windows/**"
SPDX-FileCopyrightText = "Microsoft Corporation (glyph geometry of Segoe Fluent Icons)"
SPDX-License-Identifier = "LicenseRef-Segoe-Fluent-Icons"

# Original artwork: the default caption controls, the combo box arrow, the
# tool-dialog close glyph, the transport glyphs, the application logo mark in
# every form, the wordmark renderings, and the screenshot.
[[annotations]]
path = [
    "ui/Sources/icons/default/**",
    "ui/Sources/icons/app/dialogs/double_arrow.svg",
    "ui/Sources/icons/app/dialogs/tool_dialog_close_x.svg",
    "ui/Sources/icons/app/track_controls/**",
    "ui/Sources/icons/app/rawform.svg",
    "ui/Sources/icons/app/rawform.icns",
    "ui/Sources/icons/app/rawform.icon/**",
    "ui/Sources/images/**",
    "docs/images/**",
]
SPDX-FileCopyrightText = "2026 Etienne Fleurant"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled fonts, with the license texts that ship beside them.
[[annotations]]
path = ["ui/Sources/fonts/Inter-*.ttf", "ui/Sources/fonts/Inter_OFL.txt"]
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "ui/Sources/fonts/JetBrainsMono-*.ttf",
    "ui/Sources/fonts/JetBrainsMono_OFL.txt",
]
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Documents, the desktop entry, the version file and the dotfiles.
[[annotations]]
path = [
    "README.md",
    "CHANGELOG.md",
    "THIRD-PARTY-NOTICES.md",
    "docs/*.md",
    "packaging/com.rawform.app.desktop",
    "ui/VERSION.txt",
    ".gitignore",
    ".gitattributes",
]
SPDX-FileCopyrightText = "2026 Etienne Fleurant"
SPDX-License-Identifier = "GPL-3.0-or-later"
