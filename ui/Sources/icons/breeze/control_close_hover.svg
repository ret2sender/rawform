<?xml version="1.0" encoding="UTF-8"?>
<!-- Breeze caption glyph, transcribed from KDE breeze (kdecoration/breezebutton.cpp,
     GPL-2.0-or-later). The decoration paints into an 18x18 button box with a
     1.01px round-capped pen and no fill; this file reproduces that geometry
     one to one, so render it at 18x18 logical px (the plate size) for a
     pixel match with a native Breeze window. Do not add a fill or an extra
     stroke on top: the line weight IS the glyph. -->
<svg width="18" height="18" version="1.1" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
 <g fill="none" stroke="#1b1b1b" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="miter">
  <line x1="5" y1="5" x2="13" y2="13"/>
  <line x1="13" y1="5" x2="5" y2="13"/>
 </g>
</svg>
